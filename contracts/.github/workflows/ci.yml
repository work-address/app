name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Hardhat downloads solc on first compile; keep it between runs so a
      # binaries.soliditylang.org outage does not fail an unrelated change.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hardhat-nodejs
          key: hardhat-compilers-${{ runner.os }}-${{ hashFiles('hardhat.config.ts') }}

      - run: npm ci

      - name: Compile
        run: npm run build

      # Everything runs on Hardhat's in-process network: the config names no
      # public network, and no step needs a key or an RPC URL.
      - name: Test
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      # packages/identity is pure computation: its tests trap every network
      # call, and its typecheck runs without Node types so it stays browser-safe.
      - name: Identity library tests
        run: npm run test:identity

      - name: Identity library typecheck
        run: npm run typecheck:identity

      - name: Identity library build
        run: npm run build -w @work-address/identity
