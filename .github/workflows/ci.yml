name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    # In test mode api/src/app/app-config.ts loads api/.env.test with
    # override: true, so environment variables set here cannot redirect the
    # suite. The services are shaped to the committed file instead: its user
    # (`ivan`, empty password), its database (`address_work_test`) and its
    # redis URL. Change the two together.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ivan
          POSTGRES_DB: address_work_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ivan -d address_work_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from packageManager in the root package.json.
      - uses: pnpm/action-setup@v4

      # 22, not latest: mocha 9 routes .ts through Node 24's ESM loader instead
      # of ts-node/register and no test file parses.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # api has no lint script of its own; `eslint src` is the check it is held to.
      - name: Lint
        run: |
          pnpm --filter ./api exec eslint src
          pnpm --filter ./web run lint

      - name: Typecheck
        run: |
          pnpm --filter ./api exec tsc --noEmit -p tsconfig.json
          pnpm --filter ./web exec tsc --noEmit -p tsconfig.app.json
          pnpm --filter ./web exec tsc --noEmit -p tsconfig.node.json

      # WP-128: packages/api-client is generated from the API and committed,
      # and everything that calls the API compiles against the committed
      # copy. This regenerates it and fails on any difference, so an API
      # change cannot merge without the client that matches it. The script's
      # own test runs first: a drift check that cannot fail is worse than
      # none.
      - name: The committed API client is what the API generates
        run: |
          scripts/api-client-drift.test.sh
          scripts/api-client-drift.sh

      # The test data source synchronizes and drops the schema itself, so no
      # schema step runs first.
      - name: API tests
        run: pnpm --filter ./api test

      - name: Web unit tests
        run: pnpm --filter ./web test

      # The browser project measures layout in a real browser - a jsdom run
      # reports every width as zero, so a card that scrolled sideways on a
      # phone would pass. Only chromium, which is the single instance the
      # project declares.
      - name: Install Playwright chromium
        run: pnpm --filter ./web exec playwright install --with-deps chromium

      # `web test` is `--project unit`, so this step is what actually runs the
      # 375px acceptance tests; without it they only ever ran on a laptop.
      #
      # The `storybook` project is deliberately not run here. Its build fails
      # before any test does: vite-plugin-node-polyfills shims `node:process`
      # without `stdout`/`stdin`, which storybook's own node chunk imports, so
      # esbuild refuses the bundle. Wiring it in would make CI red for a
      # dependency conflict rather than for anything in this repository.
      - name: Web browser tests
        run: pnpm --filter ./web run test:browser

  # The Solidity contracts and the @work-address/identity library. No
  # database: everything runs on Hardhat's in-process network.
  contracts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Hardhat downloads solc on first compile; keep it between runs so a
      # binaries.soliditylang.org outage does not fail an unrelated change.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hardhat-nodejs
          key: hardhat-compilers-${{ runner.os }}-${{ hashFiles('contracts/hardhat.config.ts') }}

      - run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm --filter @work-address/contracts run build

      # The config names no public network, and no step needs a key or an
      # RPC URL.
      - name: Test
        run: pnpm --filter @work-address/contracts test

      - name: Typecheck
        run: pnpm --filter @work-address/contracts run typecheck

      # packages/identity is pure computation: its tests trap every network
      # call, and its typecheck runs without Node types so it stays browser-safe.
      - name: Identity library tests
        run: pnpm --filter @work-address/identity test

      - name: Identity library typecheck
        run: pnpm --filter @work-address/identity typecheck

      - name: Identity library build
        run: pnpm --filter @work-address/identity build
