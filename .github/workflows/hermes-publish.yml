name: Publish work-address-hermes

# Pushing the tag work-address-hermes-v<version> publishes the Hermes Agent
# plugin to PyPI. The version in the tag must be the one in pyproject.toml.
# PyPI trusts this workflow, in the `pypi` environment, as the project's
# publisher; no token is stored (scripts/publish-wizard.sh sets it up).
on:
  push:
    tags:
      - 'work-address-hermes-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag matches the package version
        working-directory: packages/agent-tracker/bridges/hermes
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "work-address-hermes-v$version" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version"; exit 1; }
      - name: Test the bridge
        working-directory: packages/agent-tracker/bridges/hermes
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest test_bridge.py
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build --outdir dist packages/agent-tracker/bridges/hermes
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/work-address-hermes
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
