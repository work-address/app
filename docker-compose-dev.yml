services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: web/dockerfile.dev
    image: app-web-dev
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: sync
          path: ./web
          target: /app/web
          ignore:
            - node_modules
        - action: sync
          path: ./packages/eslint-config
          target: /app/packages/eslint-config
        - action: rebuild
          path: ./web/package.json
        - action: rebuild
          path: ./web/pnpm-lock.yaml
        - action: rebuild
          path: ./packages/eslint-config/package.json

  api:
    build:
      context: api
      dockerfile: dockerfile.dev
    image: app-api-dev
    ports:
      - "4000:4000"
    env_file:
      - ./api/.env
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "4000"
      NODE_ENV: "development"
      APP_DB_HOST: "host.docker.internal"
      APP_REDIS: "redis://redis:6379"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./api
          target: /app
          ignore:
            - node_modules
        - action: rebuild
          path: ./api/package.json
        - action: rebuild
          path: ./api/pnpm-lock.yaml
