services:
  nginx:
    build:
      context: nginx-proxy
      dockerfile: dockerfile
    image: app-nginx-proxy
    # Prefer rebuilding from this repo instead of reusing a stale tagged image locally.
    pull_policy: build
    ports:
      - "8000:8000"
    depends_on:
      - web
      - api
    networks:
      - app-network

  web:
    build:
      context: .
      dockerfile: web/dockerfile.prod
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: app-web-prod
    pull_policy: build
    # ports:
    #   - "3000:3000"
    networks:
      - app-network

  api:
    build:
      # Repo root so api/tsconfig.json can extend ../tsconfig.base.json
      context: .
      dockerfile: api/dockerfile.prod
      args:
        # Bump visibility of what's running: docker inspect app-api-prod | jq '.[0].Config.Labels'
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: app-api-prod
    pull_policy: build
    # ports:
    #   - "4000:4000"
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "4000"
      NODE_ENV: "production"
      # APP_DB_HOST: "${APP_DB_HOST}"
      # APP_DB_PORT: "${APP_DB_PORT:-5432}"
      # APP_DB_USERNAME: "${APP_DB_USERNAME}"
      # APP_DB_PASSWORD: "${APP_DB_PASSWORD}"
      # APP_DB_NAME: "${APP_DB_NAME}"
      # APP_JWT_SECRET: "${APP_JWT_SECRET}"
      APP_DB_HOST: "address.work"
      APP_DB_PORT: "5432"
      APP_DB_USERNAME: "postgres"
      APP_DB_PASSWORD: "work-address!!prod"
      APP_DB_NAME: "workaddress"
      APP_JWT_SECRET: "REDACTED"      
      APP_SENTRY: "${APP_SENTRY:-}"
      APP_REDIS: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

# Docker Networks
networks:
  app-network:
    driver: bridge
