services:
  nginx:
    build:
      context: nginx-proxy
      dockerfile: dockerfile
    image: app-nginx-proxy
    # Prefer rebuilding from this repo instead of reusing a stale tagged image locally.
    pull_policy: build
    ports:
      - "8000:8000"
    depends_on:
      - web
      - api
    networks:
      - app-network

  web:
    build:
      context: .
      dockerfile: web/dockerfile.prod
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        # Empty (not unset) makes the browser call /api on whatever origin served
        # the page - which is what a self-hosted install behind this nginx needs.
        # Bare `-` so an explicitly empty value survives; `:-` would replace it.
        VITE_API_URL: "${VITE_API_URL-https://app.address.work}"
    image: app-web-prod
    pull_policy: build
    # ports:
    #   - "3000:3000"
    networks:
      - app-network

  api:
    build:
      # Repo root so api/tsconfig.json can extend ../tsconfig.base.json
      context: .
      dockerfile: api/dockerfile.prod
    image: app-api-prod
    pull_policy: build
    # ports:
    #   - "4000:4000"
    env_file:
      - path: ./api/.env
        required: false
      - path: ./.env
        required: false
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "4000"
      NODE_ENV: "production"
      # localhost inside the container is not the host machine; extra_hosts below enables the default.
      APP_DB_HOST: "${APP_DB_HOST:-host.docker.internal}"
      APP_REDIS: "redis://redis:6379"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

# Docker Networks
networks:
  app-network:
    driver: bridge
